name: package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and smoke test standalone package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'v0.6.14-ci' }
          python tools/install.py $version
      - name: Test refreshed catalogs and release sources
        run: |
          python -m pip install -r tools/release-requirements.txt --require-hashes
          python -m unittest discover -s tests -v
      - name: Validate refreshed resource and interface schemas
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json
      - name: Verify upgrade with the packaged runtime
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/MaaBanG-*-win-x64.zip | Select-Object -First 1
          python tools/verify_package_update.py $package.FullName --work install/update-verification
      - name: Verify instance task migration with the packaged UI
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/MaaBanG-*-win-x64.zip | Select-Object -First 1
          python tools/verify_task_migration.py (Join-Path install $package.BaseName) --work install/task-migration-verification
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "MaaBanG $RELEASE_TAG" --notes-file docs/release-notes.md
